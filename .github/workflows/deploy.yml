name: Deploy to GitHub Pages and Aliyun OSS

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy docs (Global + China)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------- 海外：GitHub Pages ----------
      - name: Build website (GitHub Pages)
        env:
          SITE_URL: https://docs.ipweb.cc
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # ---------- 国内：阿里云 OSS ----------
      # SITE_URL_CN 只填域名，例如 https://docs.ipweb.cn（不要带 /docs-site 路径）
      # 若站点挂在子路径，设置 SITE_BASE_URL_CN，且与 ALIYUN_OSS_PREFIX 一致（如 /docs-site/）
      - name: Build website (Aliyun OSS / China)
        env:
          SITE_URL: ${{ secrets.SITE_URL_CN }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL_CN }}
        run: npm run build

      # 仅同步到 Bucket 内指定前缀；--delete 只删除该前缀下多余对象，不影响根目录其他目录
      # GitHub Secret: ALIYUN_OSS_PREFIX，例如 docs-site（不要首尾斜杠）
      - name: Sync build to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
        run: |
          curl -fsSL -o ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.10/ossutil64
          chmod +x ossutil64
          sudo mv ossutil64 /usr/local/bin/ossutil
          ossutil --version

          if [ -z "$OSS_PREFIX" ]; then
            echo "Error: set ALIYUN_OSS_PREFIX (e.g. docs-site). Refusing bucket-root sync with --delete."
            exit 1
          fi

          # ALIYUN_OSS_ENDPOINT 必须是地域 Endpoint，例如 oss-cn-hangzhou.aliyuncs.com
          # 不要填 CDN 域名、Bucket 外网访问域名、也不要带 https://
          OSS_ENDPOINT="${OSS_ENDPOINT#https://}"
          OSS_ENDPOINT="${OSS_ENDPOINT#http://}"
          OSS_ENDPOINT="${OSS_ENDPOINT%/}"
          if [[ "$OSS_ENDPOINT" == "${OSS_BUCKET}."* ]]; then
            OSS_ENDPOINT="${OSS_ENDPOINT#${OSS_BUCKET}.}"
          fi
          if ! [[ "$OSS_ENDPOINT" =~ ^oss-[a-z0-9-]+\.aliyuncs\.com$ ]]; then
            echo "::error::ALIYUN_OSS_ENDPOINT must be like oss-cn-hangzhou.aliyuncs.com (see OSS console -> Bucket overview -> Endpoint)."
            exit 1
          fi
          if ! getent hosts "$OSS_ENDPOINT" > /dev/null; then
            echo "::error::Cannot resolve $OSS_ENDPOINT — check typo or use public endpoint (not *-internal.aliyuncs.com on GitHub runners)."
            exit 1
          fi

          OSS_PREFIX="${OSS_PREFIX#/}"
          OSS_PREFIX="${OSS_PREFIX%/}/"
          DEST="oss://${OSS_BUCKET}/${OSS_PREFIX}"
          echo "Syncing build/ -> ${DEST}"
          echo "Endpoint: ${OSS_ENDPOINT}"
          ossutil sync build/ "$DEST" \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            --delete \
            --force \
            --jobs 10

      # 可选：刷新 CDN 缓存（需 RAM 具备 cdn:RefreshObjectCaches；失败不阻断部署）
      - name: Refresh CDN cache
        continue-on-error: true
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          CDN_REFRESH_URL: ${{ secrets.ALIYUN_CDN_REFRESH_URL }}
          # CDN OpenAPI 地域，一般为 cn-hangzhou
          ALIYUN_REGION: cn-hangzhou
        run: |
          if [ -z "$CDN_REFRESH_URL" ]; then
            echo "Skipping CDN refresh: ALIYUN_CDN_REFRESH_URL secret is not set"
            exit 0
          fi
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun-cli.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo install -m 755 /tmp/aliyun /usr/local/bin/aliyun
          aliyun version
          aliyun configure set --profile default --mode AK \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --region "$ALIYUN_REGION"
          if ! aliyun cdn RefreshObjectCaches \
            --ObjectPath "$CDN_REFRESH_URL" \
            --ObjectType Directory; then
            echo "::warning::CDN refresh failed. Add cdn:RefreshObjectCaches to the RAM user, or remove ALIYUN_CDN_REFRESH_URL to skip. OSS upload is already complete."
            exit 1
          fi
          echo "CDN cache refresh submitted for $CDN_REFRESH_URL"
